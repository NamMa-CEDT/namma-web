<html lang="th">

    <meta name="theme-color" content="#0a1322" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="น้ำมา: ผู้ช่วย AI เรื่องน้ำท่วม เช็กระดับน้ำใกล้บ้านแบบเรียลไทม์ ถามได้ทุกเรื่องน้ำท่วม ไม่ใช่หน่วยงานราชการ เหตุฉุกเฉินโทร 1784" />
    <!-- Link preview (LINE, Facebook, X). og:image must be an absolute URL; update it if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="น้ำมา NamMa" />
    <meta property="og:title" content="น้ำมา NamMa" />
    <meta property="og:description" content="น้ำมา: ผู้ช่วย AI เรื่องน้ำท่วม เช็กระดับน้ำใกล้บ้านแบบเรียลไทม์ ถามได้ทุกเรื่องน้ำท่วม ไม่ใช่หน่วยงานราชการ เหตุฉุกเฉินโทร 1784" />
    <meta property="og:image" content="https://110.238.115.73.sslip.io/brand/namma-line-profile.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>น้ำมา NamMa</title>
    <!-- Saved light/dark choice (src/lib/theme.ts), applied before first paint. -->
    <script>
      try {
        var t = localStorage.getItem("namma.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
