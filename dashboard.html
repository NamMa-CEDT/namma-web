<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NamMa Responders</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>🚑 คำขอความช่วยเหลือ</b> <span class="muted" id="upd"></span>
  <nav><a href="index.html">แชท + แผนที่</a> · <a href="dashboard.html">ทีมช่วยเหลือ</a></nav>
</header>
<div id="map" style="height:40vh"></div>
<div class="wrap">
  <table>
    <thead><tr><th>#</th><th>ความเร่งด่วน</th><th>สถานะ</th><th>ข้อความ</th><th>คน</th><th>ดูแลพิเศษ</th><th>ต้องการ</th><th>ตำแหน่ง</th><th>เวลา</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const NEED = { boat: "เรือ", food: "อาหาร", drinking_water: "น้ำดื่ม", medicine: "ยา", power: "ไฟฟ้า", medical: "แพทย์", transport: "รถ", evacuation: "อพยพ" };
const ST = { unconfirmed: "รอยืนยัน", open: "เปิด", assigned: "รับเรื่องแล้ว", done: "เสร็จ", cancelled: "ยกเลิก" };
const map = L.map("map").setView([14.6, 100.45], 8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Responder token: open dashboard.html?token=... once; it is remembered in this browser.
let token = new URLSearchParams(location.search).get("token");
try { if (token) localStorage.setItem("namma_responder", token); else token = localStorage.getItem("namma_responder"); } catch {}
const auth = () => token ? { Authorization: "Bearer " + token } : {};

async function setStatus(id, status) {
  await fetch(`/api/tickets/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json", ...auth() }, body: JSON.stringify({ status }) });
  load();
}
async function load() {
  const r = await fetch("/api/tickets", { headers: auth() });
  if (r.status === 401) { document.getElementById("upd").textContent = "ต้องใช้ลิงก์ที่มี ?token= ของทีมช่วยเหลือ"; return; }
  const rows = await r.json();
  const tb = document.getElementById("rows"); tb.innerHTML = ""; layer.clearLayers();
  for (const t of rows) {
    const tr = document.createElement("tr");
    tr.className = [t.urgency, t.status].join(" ");
    const loc = t.lat != null ? `${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}` : "—";
    tr.innerHTML = `<td>${t.id}</td>
      <td><span class="pill" style="color:${t.urgency === "critical" ? "#d03030" : "#e07020"}">${t.urgency === "critical" ? "วิกฤต" : "สูง"}</span></td>
      <td>${ST[t.status] || esc(t.status)}</td><td>${esc(t.raw_text)}</td><td>${t.people_count ?? "?"}</td>
      <td>${esc((t.vulnerable || []).join(", "))}</td><td>${esc((t.needs || []).map(n => NEED[n] || n).join(", "))}</td>
      <td>${loc}</td><td>${new Date(t.created_at).toLocaleString("th-TH")}</td>
      <td><select>${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === t.status ? "selected" : ""}>${v}</option>`).join("")}</select></td>`;
    tr.querySelector("select").onchange = e => setStatus(t.id, e.target.value);
    tb.appendChild(tr);
    if (t.lat != null && !["done", "cancelled"].includes(t.status))
      L.circleMarker([t.lat, t.lon], { radius: 9, color: t.urgency === "critical" ? "#d03030" : "#e07020", fillOpacity: .9 })
        .bindPopup(`<b>#${t.id}</b> ${esc(t.raw_text)}`).addTo(layer);
  }
  document.getElementById("upd").textContent = "อัปเดต " + new Date().toLocaleTimeString("th-TH");
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
